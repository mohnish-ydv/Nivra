name: Verify D3 Compiler Foundation

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Specs, Rust tests, CLI, release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version
          rustfmt --version

      - name: Run cumulative golden verifier
        env:
          NIVRA_APPLY_FORMAT: "1"
          NIVRA_REQUIRE_FORMAT: "1"
        run: bash verify.sh

      - name: Build release workspace
        run: cargo build --workspace --release --locked

      - name: Generate reports
        run: |
          python3 tools/d2_report.py > D2-ARCHITECTURE-REPORT.txt
          python3 tools/d3_report.py > D3-COMPILER-FOUNDATION-REPORT.txt
          ./target/release/nivra doctor > D3-NIVRA-DOCTOR.txt

      - name: Upload D3 Linux artifact and reports
        uses: actions/upload-artifact@v4
        with:
          name: nivra-d3-linux-x86_64
          path: |
            target/release/nivra
            D2-ARCHITECTURE-REPORT.txt
            D3-COMPILER-FOUNDATION-REPORT.txt
            D3-NIVRA-DOCTOR.txt
            MANUAL-VERIFICATION.md
          if-no-files-found: error
          retention-days: 14
