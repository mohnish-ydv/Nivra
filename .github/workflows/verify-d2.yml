name: Verify Nivra D2

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: D1 regression and D2 architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Python version
        run: python3 --version

      - name: Run cumulative golden verifier
        run: bash verify.sh

      - name: Generate D2 report
        run: python3 tools/d2_report.py | tee NIVRA-D2-REPORT.txt

      - name: Upload architecture report
        uses: actions/upload-artifact@v4
        with:
          name: nivra-d2-architecture-report
          path: NIVRA-D2-REPORT.txt
          if-no-files-found: error
          retention-days: 14
