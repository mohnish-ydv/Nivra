name: Verify D5 Semantic Resolution

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Specs, semantic tests, CLI, release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install 1.74.0 --profile minimal --component rustfmt
          rustup default 1.74.0
          rustc --version
          cargo --version
          rustfmt --version

      - name: Run cumulative golden verifier
        env:
          NIVRA_APPLY_FORMAT: "1"
          NIVRA_REQUIRE_FORMAT: "1"
        run: bash verify.sh

      - name: Build release workspace
        run: cargo build --workspace --release --locked

      - name: Run release CLI semantic smoke
        env:
          NIVRA_BIN: ${{ github.workspace }}/target/release/nivra
        run: bash scripts/d5-smoke.sh

      - name: Generate reports
        run: |
          python3 tools/d2_report.py > D2-ARCHITECTURE-REPORT.txt
          python3 tools/d3_report.py > D3-COMPILER-FOUNDATION-REPORT.txt
          python3 tools/d4_report.py > D4-PARSER-AST-REPORT.txt
          python3 tools/d5_report.py > D5-SEMANTIC-REPORT.txt
          ./target/release/nivra doctor > D5-NIVRA-DOCTOR.txt
          ./target/release/nivra resolve examples/d5/05_complete_semantic_tour.nva --symbols --scopes > D5-SYMBOL-SCOPE-REPORT.txt
          ./target/release/nivra resolve examples/d5/01_module_index.nva --json > D5-SEMANTIC-GRAPH.json

      - name: Upload D5 Linux artifact and reports
        uses: actions/upload-artifact@v4
        with:
          name: nivra-d5-linux-x86_64
          path: |
            target/release/nivra
            D2-ARCHITECTURE-REPORT.txt
            D3-COMPILER-FOUNDATION-REPORT.txt
            D4-PARSER-AST-REPORT.txt
            D5-SEMANTIC-REPORT.txt
            D5-NIVRA-DOCTOR.txt
            D5-SYMBOL-SCOPE-REPORT.txt
            D5-SEMANTIC-GRAPH.json
            MANUAL-VERIFICATION.md
          if-no-files-found: error
          retention-days: 14
