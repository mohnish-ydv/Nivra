name: Verify D6 Type Checker

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Specs, type tests, CLI, release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.74.0 --profile minimal --component rustfmt
          rustup default 1.74.0
          rustc --version
          cargo --version
          rustfmt --version

      - name: Validate local dependency graph
        run: |
          python3 tools/d6_dependency_lint.py
          cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Compile and run D6 type-crate tests
        run: cargo test -p nivra-types --lib --locked

      - name: Run Rust test suite
        run: cargo test --workspace --all-targets --locked

      - name: Run cumulative golden verifier
        env:
          NIVRA_APPLY_FORMAT: "1"
          NIVRA_REQUIRE_FORMAT: "1"
        run: bash verify.sh

      - name: Build release workspace
        run: cargo build --workspace --release --locked

      - name: Run release type-checker smoke
        env:
          NIVRA_BIN: ${{ github.workspace }}/target/release/nivra
        run: bash scripts/d6-smoke.sh

      - name: Generate D6 reports
        run: |
          python3 tools/d2_report.py > D2-ARCHITECTURE-REPORT.txt
          python3 tools/d3_report.py > D3-COMPILER-FOUNDATION-REPORT.txt
          python3 tools/d4_report.py > D4-PARSER-AST-REPORT.txt
          python3 tools/d5_report.py > D5-SEMANTIC-REPORT.txt
          python3 tools/d6_report.py > D6-TYPE-CHECKER-REPORT.txt
          ./target/release/nivra doctor > D6-NIVRA-DOCTOR.txt
          ./target/release/nivra typecheck examples/d6/05_complete_type_tour.nva --functions --types > D6-TYPE-REPORT.txt
          ./target/release/nivra typecheck examples/d6/02_functions_and_calls.nva --json > D6-TYPE-GRAPH.json

      - name: Upload D6 Linux artifact and reports
        uses: actions/upload-artifact@v4
        with:
          name: nivra-d6-linux-x86_64
          path: |
            target/release/nivra
            D2-ARCHITECTURE-REPORT.txt
            D3-COMPILER-FOUNDATION-REPORT.txt
            D4-PARSER-AST-REPORT.txt
            D5-SEMANTIC-REPORT.txt
            D6-TYPE-CHECKER-REPORT.txt
            D6-NIVRA-DOCTOR.txt
            D6-TYPE-REPORT.txt
            D6-TYPE-GRAPH.json
            MANUAL-VERIFICATION.md
          if-no-files-found: error
          retention-days: 14
