name: Verify D1 Foundation

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: D1 specification and examples
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Python version
        run: python3 --version

      - name: Run golden verifier
        run: bash verify.sh

      - name: Save D1 report
        run: python3 tools/spec_report.py | tee D1-SPEC-REPORT.txt

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: trion-d1-spec-report
          path: D1-SPEC-REPORT.txt
          if-no-files-found: error
          retention-days: 14
