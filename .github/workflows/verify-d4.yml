name: Verify D4 Parser and AST

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Specs, parser tests, CLI, release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version
          rustfmt --version

      - name: Run cumulative golden verifier
        env:
          NIVRA_APPLY_FORMAT: "1"
          NIVRA_REQUIRE_FORMAT: "1"
        run: bash verify.sh

      - name: Build release workspace
        run: cargo build --workspace --release --locked

      - name: Run release CLI parser smoke
        env:
          NIVRA_BIN: ${{ github.workspace }}/target/release/nivra
        run: bash scripts/d4-smoke.sh

      - name: Generate reports
        run: |
          python3 tools/d2_report.py > D2-ARCHITECTURE-REPORT.txt
          python3 tools/d3_report.py > D3-COMPILER-FOUNDATION-REPORT.txt
          python3 tools/d4_report.py > D4-PARSER-AST-REPORT.txt
          ./target/release/nivra doctor > D4-NIVRA-DOCTOR.txt
          ./target/release/nivra parse examples/d4/05_complete_parser_tour.nva --tree > D4-CST-TREE.txt

      - name: Upload D4 Linux artifact and reports
        uses: actions/upload-artifact@v4
        with:
          name: nivra-d4-linux-x86_64
          path: |
            target/release/nivra
            D2-ARCHITECTURE-REPORT.txt
            D3-COMPILER-FOUNDATION-REPORT.txt
            D4-PARSER-AST-REPORT.txt
            D4-NIVRA-DOCTOR.txt
            D4-CST-TREE.txt
            MANUAL-VERIFICATION.md
          if-no-files-found: error
          retention-days: 14
